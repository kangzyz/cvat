# Optional GPU/runtime configuration for the video curation workflow.
#
# Ubuntu deployment example:
#   CVAT_SHARE_ROOT=/mnt/cvat-share \
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requirements on the host:
# - NVIDIA driver
# - NVIDIA Container Toolkit
# - Docker Compose with `gpus` support
#
# This file builds an NVIDIA FFmpeg-capable server image, passes the GPU into
# cvat_server, and mounts a writable share path for video curation inputs/frames.

x-video-curation-share: &video-curation-share
  type: bind
  source: ${CVAT_SHARE_ROOT:-./share}
  target: /home/django/share
  bind:
    create_host_path: true

services:
  cvat_server:
    build:
      context: .
      args:
        BASE_IMAGE: ${CVAT_CUDA_BASE_IMAGE:-nvidia/cuda:12.6.3-devel-ubuntu24.04}
        FFMPEG_WITH_NVIDIA: ${FFMPEG_WITH_NVIDIA:-yes}
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    volumes:
      - *video-curation-share

  cvat_worker_import:
    volumes:
      - *video-curation-share

  cvat_worker_export:
    volumes:
      - *video-curation-share

  cvat_worker_annotation:
    volumes:
      - *video-curation-share

  cvat_worker_chunks:
    volumes:
      - *video-curation-share

  cvat_worker_quality_reports:
    volumes:
      - *video-curation-share

  cvat_worker_consensus:
    volumes:
      - *video-curation-share

  cvat_worker_utils:
    volumes:
      - *video-curation-share

  cvat_worker_webhooks:
    volumes:
      - *video-curation-share
